name: bloom
description: "bloom. — habit, task and journal tracker (Flutter port of the React prototype)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # 6.x targets package:flutter/material.dart. 9.x switched to the vendored
  # `material_ui` package, whose TextTheme is a different type.
  google_fonts: ^6.3.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/bloom_logo.jpg
    - assets/fonts/
