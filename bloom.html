<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bloom. — single-file prototype</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap');

/* ============================================================
   bloom. — Material 3 Android prototype
   ============================================================ */

:root {
  --font-body: 'DM Sans', system-ui, sans-serif;
  --font-display: 'Manrope', system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  font-synthesis: none;
  background: #e7ebe2;
  color: #1b2118;
  font-size: 14px;
}

button, input, textarea { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; opacity: .4; }
button, a { transition: background .18s ease, color .18s ease, transform .15s ease, box-shadow .18s ease; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [role='switch']:focus-visible, [role='radio']:focus-visible {
  outline: 3px solid #89b9a0;
  outline-offset: 3px;
}
h1, h2, h3, p, ul, ol, li { margin: 0; padding: 0; }
ul, ol { list-style: none; }
svg { flex-shrink: 0; }

/* ---------- Material 3 tonal palette (light) ---------- */

.device {
  --primary: #3a6b4e;
  --on-primary: #ffffff;
  --primary-container: #bcf0c6;
  --on-primary-container: #00210d;
  --secondary: #52634f;
  --secondary-container: #d5e8cf;
  --on-secondary-container: #101f10;
  --tertiary: #38656a;
  --surface: #f7faf2;
  --surface-container: #ffffff;
  --surface-container-high: #edf1e8;
  --surface-container-low: #f2f5ec;
  --on-surface: #1b2118;
  --on-surface-variant: #43483f;
  --outline: #c3c8bc;
  --outline-soft: #e2e6da;
  --error: #ba1a1a;
  --on-error: #fff;
  --scrim: rgba(16, 24, 16, 0.42);
  --shadow-1: 0 1px 2px rgba(27, 33, 24, 0.08), 0 1px 3px rgba(27, 33, 24, 0.06);
  --shadow-2: 0 4px 12px rgba(27, 33, 24, 0.1), 0 2px 4px rgba(27, 33, 24, 0.06);
  --shadow-3: 0 12px 32px rgba(27, 33, 24, 0.16);
  --ring-track: #e3e8db;
  --snackbar-bg: #2f3429;
  --snackbar-fg: #edf1e8;

  --tone-green-bg: #dfe9d3;  --tone-green-fg: #37592b;
  --tone-sky-bg: #d9e9f8;    --tone-sky-fg: #2f5c85;
  --tone-peach-bg: #f8e4c8;  --tone-peach-fg: #7d5527;
  --tone-lilac-bg: #e7e0f6;  --tone-lilac-fg: #554a7e;
  --tone-rose-bg: #f8dade;   --tone-rose-fg: #8a3f4b;
  --tone-sand-bg: #eee3cd;   --tone-sand-fg: #6f5d3a;
}

.device.dark {
  --primary: #a1d4ab;
  --on-primary: #07381a;
  --primary-container: #235234;
  --on-primary-container: #bcf0c6;
  --secondary: #b9ccb3;
  --secondary-container: #3a4b38;
  --on-secondary-container: #d5e8cf;
  --tertiary: #a2ced3;
  --surface: #11140f;
  --surface-container: #1a1e18;
  --surface-container-high: #23271f;
  --surface-container-low: #1e221b;
  --on-surface: #e2e3dc;
  --on-surface-variant: #c3c8bc;
  --outline: #8d9287;
  --outline-soft: #33372f;
  --error: #ffb4ab;
  --scrim: rgba(0, 0, 0, 0.55);
  --ring-track: #33372f;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-2: 0 4px 12px rgba(0, 0, 0, 0.45);
  --shadow-3: 0 12px 32px rgba(0, 0, 0, 0.55);

  --tone-green-bg: #2c4524;  --tone-green-fg: #b6d7a6;
  --tone-sky-bg: #1f3a54;    --tone-sky-fg: #b0d4f2;
  --tone-peach-bg: #55401f;  --tone-peach-fg: #f4cf96;
  --tone-lilac-bg: #3f365f;  --tone-lilac-fg: #d4c8f4;
  --tone-rose-bg: #57303a;   --tone-rose-fg: #f4bcc6;
  --tone-sand-bg: #4d4128;   --tone-sand-fg: #e8d5ad;
}

/* ---------- Device stage & frame ---------- */

.device-stage {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 26px 16px;
  background:
    radial-gradient(1200px 700px at 50% -10%, #f2f5ec 0%, transparent 60%),
    radial-gradient(900px 600px at 110% 110%, #e4ecdc 0%, transparent 55%),
    #e7ebe2;
}
.device.dark-stage { background: #10130e; }

.device {
  position: relative;
  width: min(393px, 100vw - 40px, calc((100dvh - 130px) * 0.462));
  height: min(852px, 100dvh - 120px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 46px;
  border: 10px solid #171a15;
  box-shadow:
    0 0 0 1.5px #3a4136,
    0 0 0 4px #22261f,
    0 30px 70px rgba(24, 34, 24, 0.28);
  background: var(--surface);
  color: var(--on-surface);
  user-select: none;
}

.device-caption {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  width: min(393px, 100vw - 40px, calc((100dvh - 130px) * 0.462));
  color: #6d7a67;
}
.device-caption span:first-child { font-weight: 650; font-size: 13px; color: #4e5c48; }
.device-caption span:last-child { font-size: 8px; letter-spacing: 1.6px; }

@media (max-width: 540px) {
  .device-stage { padding: 0; background: var(--surface, #f7faf2); }
  .device {
    width: 100vw;
    height: 100dvh;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }
  .device-caption { display: none; }
}

/* ---------- Status bar & system nav ---------- */

.status-bar {
  height: 38px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 26px;
  position: relative;
  z-index: 5;
  font-size: 12px;
  font-weight: 600;
  color: var(--on-surface);
}
.camera-cutout {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #0d100c;
  box-shadow: inset 0 0 0 3px #1c211a, inset 0 0 0 4.5px #2a3128, 0 0 0 1px rgba(0, 0, 0, 0.08);
}
.status-indicators { display: flex; align-items: center; gap: 5px; }
.battery { display: flex; align-items: center; gap: 1.5px; }
.battery-body {
  width: 21px;
  height: 11px;
  border: 1.4px solid currentColor;
  border-radius: 3px;
  padding: 1.5px;
  opacity: 0.95;
}
.battery-body i { display: block; height: 100%; background: currentColor; border-radius: 1px; }
.battery-cap { width: 1.6px; height: 5px; background: currentColor; border-radius: 0 1px 1px 0; opacity: 0.95; }

.system-nav {
  height: 26px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
}
.sys-pill { width: 112px; height: 4px; border-radius: 4px; background: var(--on-surface-variant); opacity: 0.85; }

/* ---------- App body layout ---------- */

.app-body { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }

.top-bar {
  flex-shrink: 0;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px 0 16px;
  gap: 10px;
}
.top-bar-left { display: flex; align-items: center; gap: 11px; min-width: 0; }
.top-bar-title { display: flex; flex-direction: column; line-height: 1.12; min-width: 0; }
.top-bar-title strong { font-family: var(--font-display); font-size: 18px; font-weight: 800; letter-spacing: -0.5px; color: var(--on-surface); }
.top-bar-title span { font-size: 10px; color: var(--on-surface-variant); letter-spacing: 0.4px; }
.top-bar-actions { display: flex; align-items: center; gap: 6px; }

.brand-mark {
  display: grid;
  place-items: center;
  background: var(--primary);
  color: var(--on-primary);
  border-radius: 12px;
  transform: rotate(-6deg);
  flex-shrink: 0;
}
.brand-mark svg { transform: rotate(6deg); }

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--primary-container);
  color: var(--on-primary-container);
  font-weight: 650;
  font-size: 14px;
  display: grid;
  place-items: center;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.avatar.big { width: 64px; height: 64px; font-size: 24px; border-radius: 24px; }

.scroller {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 2px 16px 26px;
  scrollbar-width: none;
  animation: screen-in 0.28s cubic-bezier(0.2, 0, 0, 1);
}
.scroller::-webkit-scrollbar { display: none; }

@keyframes screen-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- Bottom navigation ---------- */

.nav-bar {
  flex-shrink: 0;
  display: flex;
  align-items: stretch;
  justify-content: space-around;
  padding: 10px 6px max(12px, env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--surface-container) 88%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--outline-soft);
  z-index: 30;
}
.nav-bar button {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 4px 0;
  color: var(--on-surface-variant);
  position: relative;
  overflow: hidden;
  border-radius: 16px;
}
.nav-pill {
  display: grid;
  place-items: center;
  width: 58px;
  height: 32px;
  border-radius: 16px;
  transition: background 0.22s cubic-bezier(0.2, 0, 0, 1), color 0.2s;
}
.nav-bar button.active { color: var(--on-secondary-container); }
.nav-bar button.active .nav-pill { background: var(--secondary-container); color: var(--primary); }
.nav-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1px; }

/* ---------- FAB ---------- */

.fab-wrap { position: absolute; right: 18px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 35; }
.fab {
  width: 60px;
  height: 60px;
  border-radius: 18px;
  background: var(--primary-container);
  color: var(--on-primary-container);
  display: grid;
  place-items: center;
  box-shadow: var(--shadow-2);
  position: relative;
  overflow: hidden;
}
.fab:hover { box-shadow: var(--shadow-3); }
.fab:active { transform: scale(0.94); }

/* ---------- Ripple ---------- */

.ink {
  position: absolute;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.16;
  transform: scale(0);
  animation: ink-spread 0.55s ease-out forwards;
  pointer-events: none;
}
@keyframes ink-spread {
  to { transform: scale(1); opacity: 0; }
}

/* ---------- Screens & cards ---------- */

.screen { display: flex; flex-direction: column; gap: 14px; padding-bottom: 10px; }

.card {
  background: var(--surface-container);
  border: 1px solid var(--outline-soft);
  border-radius: 22px;
  padding: 18px;
  box-shadow: var(--shadow-1);
}
.device.dark .card { box-shadow: none; }

.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.card-head h2 { font-family: var(--font-display); font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
.card-head p { font-size: 11.5px; color: var(--on-surface-variant); margin-top: 3px; }

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--on-surface-variant);
}
.eyebrow i { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }

.page-head h1 { font-family: var(--font-display); font-size: 27px; font-weight: 750; letter-spacing: -0.9px; line-height: 1.25; margin: 8px 0 6px; }
.page-head p { font-size: 12.5px; color: var(--on-surface-variant); line-height: 1.6; }
.page-head { padding: 4px 4px 2px; }

/* ---------- Hero ---------- */

.hero {
  background:
    radial-gradient(340px 200px at 90% -20%, var(--primary-container) 0%, transparent 70%),
    radial-gradient(300px 220px at -10% 110%, var(--secondary-container) 0%, transparent 65%),
    var(--surface-container);
  border: 1px solid var(--outline-soft);
  padding: 20px 18px 16px;
}
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.hero-date { font-size: 10.5px; color: var(--on-surface-variant); white-space: nowrap; }
.hero h1 { font-family: var(--font-display); font-size: 24px; font-weight: 750; letter-spacing: -0.8px; line-height: 1.3; margin-bottom: 16px; }
.hero-rings { display: flex; align-items: center; gap: 16px; }

.ring { position: relative; flex-shrink: 0; }
.ring-arc { animation: none; }
.ring-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
}
.ring-center strong { font-family: var(--font-display); font-size: 22px; font-weight: 750; color: var(--primary); letter-spacing: -0.5px; }
.ring-center span { font-size: 9px; color: var(--on-surface-variant); }

.hero-stats { display: flex; flex-direction: column; gap: 12px; min-width: 0; flex: 1; }
.hero-stats li { display: flex; align-items: center; gap: 10px; color: var(--primary); }
.hero-stats li > div { display: flex; flex-direction: column; min-width: 0; }
.hero-stats strong { font-family: var(--font-display); font-size: 14.5px; font-weight: 700; color: var(--on-surface); }
.hero-stats span { font-size: 10.5px; color: var(--on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Tasks ---------- */

.task-list { display: flex; flex-direction: column; }
.task-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid var(--outline-soft);
}
.task-row:last-child { border-bottom: 0; padding-bottom: 4px; }
.task-row:first-child { padding-top: 6px; }

.checkbox {
  width: 26px;
  height: 26px;
  border-radius: 9px;
  border: 2px solid var(--outline);
  display: grid;
  place-items: center;
  color: transparent;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  transition: background 0.2s, border-color 0.2s, transform 0.15s;
}
.checkbox:active { transform: scale(0.88); }
.task-row.done .checkbox { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

.task-info { flex: 1; min-width: 0; }
.task-title {
  display: block;
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: -0.1px;
  line-height: 1.45;
  overflow-wrap: anywhere;
  transition: color 0.2s;
}
.task-row.done .task-title { text-decoration: line-through; color: var(--on-surface-variant); }
.task-meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; }

.cat {
  font-style: normal;
  font-size: 9px;
  font-weight: 650;
  letter-spacing: 0.6px;
  border-radius: 6px;
  padding: 3px 7px;
  background: var(--surface-container-high);
  color: var(--on-surface-variant);
}
.cat-personal { background: #ece6f6; color: #66558b; }
.cat-work { background: #ddebf9; color: #41678e; }
.cat-wellness { background: #e0edda; color: #4d7440; }
.device.dark .cat-personal { background: #3b3352; color: #cabef0; }
.device.dark .cat-work { background: #294258; color: #b3d2ee; }
.device.dark .cat-wellness { background: #2e4327; color: #b6d6a8; }

.task-time {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10.5px;
  color: var(--on-surface-variant);
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--on-surface-variant);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.icon-btn:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
.icon-btn.ghost { width: 34px; height: 34px; color: var(--outline); }
.icon-btn.ghost:hover { color: var(--error); background: color-mix(in srgb, var(--error) 10%, transparent); }
.icon-btn .dot {
  position: absolute;
  top: 9px;
  right: 10px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--primary);
  border: 2px solid var(--surface);
}

/* ---------- Habits ---------- */

.habit-list { display: flex; flex-direction: column; }
.habit-row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--outline-soft); }
.habit-row:last-child { border-bottom: 0; padding-bottom: 4px; }
.habit-row:first-child { padding-top: 6px; }
.habit-row.detailed { flex-direction: column; align-items: stretch; gap: 0; }
.habit-main { display: flex; align-items: center; gap: 12px; padding: 4px 0 10px; }

.icon-tile {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 14px;
  flex-shrink: 0;
}
.tone-green { background: var(--tone-green-bg); color: var(--tone-green-fg); }
.tone-sky { background: var(--tone-sky-bg); color: var(--tone-sky-fg); }
.tone-peach { background: var(--tone-peach-bg); color: var(--tone-peach-fg); }
.tone-lilac { background: var(--tone-lilac-bg); color: var(--tone-lilac-fg); }
.tone-rose { background: var(--tone-rose-bg); color: var(--tone-rose-fg); }
.tone-sand { background: var(--tone-sand-bg); color: var(--tone-sand-fg); }

.habit-info { flex: 1; min-width: 0; text-align: left; padding: 0; position: relative; overflow: hidden; border-radius: 10px; }
.habit-info strong { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; letter-spacing: -0.1px; overflow-wrap: anywhere; }
.habit-info small { display: block; font-size: 11px; color: var(--on-surface-variant); margin-top: 3px; line-height: 1.4; }

.break-tag {
  font-style: normal;
  font-size: 7.5px;
  font-weight: 700;
  letter-spacing: 0.8px;
  background: color-mix(in srgb, var(--error) 14%, transparent);
  color: var(--error);
  padding: 2.5px 5px;
  border-radius: 4px;
}

.streak-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 12px;
  font-weight: 650;
  color: #b07a3c;
  flex-shrink: 0;
}
.device.dark .streak-badge { color: #e5b375; }

.habit-check {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 2px solid var(--outline);
  color: var(--on-surface-variant);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
}
.habit-check:active { transform: scale(0.9); }
.habit-check.checked { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

.habit-detail { padding: 10px 0 12px; border-top: 1px dashed var(--outline-soft); animation: screen-in 0.22s ease; }
.detail-stats { display: flex; gap: 14px; margin-bottom: 10px; }
.detail-stats span { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--on-surface-variant); font-weight: 600; }

.week-dots { display: inline-flex; gap: 5px; align-items: center; }
.week-dots i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--surface-container-high);
  border: 1.5px solid var(--outline);
}
.week-dots i.on { background: var(--primary); border-color: var(--primary); }

.detail-actions { display: flex; justify-content: flex-end; margin-top: 10px; }

/* ---------- Mood ---------- */

.mood-card .moods { display: flex; justify-content: space-between; gap: 6px; margin-top: 14px; }
.moods button {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding: 10px 4px 8px;
  border-radius: 16px;
  color: var(--on-surface-variant);
  opacity: 0.65;
  position: relative;
  overflow: hidden;
  transition: opacity 0.2s, background 0.2s;
}
.moods button.chosen { opacity: 1; background: var(--secondary-container); color: var(--on-secondary-container); }
.moods button span { font-size: 9.5px; font-weight: 650; }

.mini-moods { display: flex; gap: 4px; }
.mini-moods button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--on-surface-variant);
  opacity: 0.6;
  position: relative;
  overflow: hidden;
}
.mini-moods button.chosen { opacity: 1; background: var(--secondary-container); color: var(--on-secondary-container); }

/* ---------- Week strip ---------- */

.week-strip { display: flex; gap: 8px; margin-top: 14px; }
.week-cell { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }

.empty-state { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 34px 20px; text-align: center; }
.empty-icon {

.composer-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }

.entry-list { display: flex; flex-direction: column; gap: 12px; }
.entry header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.entry p { font-size: 13px; line-height: 1.7; margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }

.insight-stats li { display: flex; align-items: baseline; gap: 8px; }

}

.text-btn {

  align-items: center;
  gap: 6px;
  color: var(--primary);
  font-size: 11.5px;
  font-weight: 700;
  padding: 8px 10px;

  flex-shrink: 0;
}
.text-btn:hover { background: color-mix(in srgb, var(--primary) 10%, transparent); }
.text-btn.danger { color: var(--error); }

.text-btn.center { justify-content: center; width: 100%; margin-top: 6px; }

.confirm-row {
  margin-top: 10px;
  padding: 12px 14px;
  border-radius: 16px;
  background: color-mix(in srgb, var(--error) 9%, transparent);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.confirm-row > span { font-size: 12px; font-weight: 550; color: var(--on-surface); line-height: 1.55; }
.confirm-row > div { display: flex; justify-content: flex-end; align-items: center; gap: 2px; }
.confirm-row .text-btn { padding: 8px 12px; }

/* ---------- Bottom sheets ---------- */

.sheet-scrim {

  inset: 0;
  background: var(--scrim);
  backdrop-filter: blur(2px);
  z-index: 60;
  display: flex;
  align-items: flex-end;
  animation: fade-in 0.2s ease;
}
@keyframes fade-in { from { opacity: 0; } }

.sheet {

  overscroll-behavior: contain;
  background: var(--surface-container-low);
  border-radius: 30px 30px 0 0;

}

@keyframes sheet-up {

}

.sheet-handle {

}
.sheet h2 { font-family: var(--font-display); font-size: 21px; font-weight: 750; letter-spacing: -0.6px; }

.choice-row { display: flex; gap: 8px; }

.choice-row button .cat { display: block; text-align: center; padding: 8px 0; border-radius: 9px; }
.choice-row button.chosen { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 14px; }

.choice-pill {

  border-radius: 999px;
  border: 1.5px solid var(--outline);
  font-size: 12.5px;
  font-weight: 650;
  color: var(--on-surface-variant);
  position: relative;
  overflow: hidden;
}

  place-items: center;
  padding: 7px;
  border-radius: 18px;
  border: 2px solid transparent;
  position: relative;
  overflow: hidden;
}

  display: flex;
  gap: 13px;
  align-items: flex-start;
  background: var(--surface-container);
  border: 1px solid var(--outline-soft);
  border-radius: 18px;

}

.sheet > .filled-btn { margin-top: 20px; }

.profile-head { display: flex; align-items: center; gap: 16px; margin-top: 14px; }

.setting-row {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--surface-container);
  border: 1px solid var(--outline-soft);
  border-radius: 18px;
  padding: 14px;
  margin-top: 14px;
}
.setting-row .icon-tile { width: 42px; height: 42px; }
.setting-row > div { flex: 1; min-width: 0; }
.setting-row strong { display: block; font-size: 13.5px; font-weight: 650; }
.setting-row span:not(.icon-tile) { display: block; font-size: 11px; color: var(--on-surface-variant); margin-top: 2px; }

/* ---------- Switch ---------- */

.switch {
  width: 54px;
  height: 32px;
  border-radius: 999px;
  border: 2px solid var(--outline);
  background: var(--surface-container-high);
  position: relative;
  flex-shrink: 0;

}

  height: 16px;

.switch.on { background: var(--primary); border-color: var(--primary); }
.switch.on .switch-thumb { transform: translate(21px, -50%); width: 24px; height: 24px; background: var(--on-primary); }

.snackbar {
  position: absolute;
  left: 14px;
  right: 14px;
  bottom: calc(96px + env(safe-area-inset-bottom));

}
@keyframes snack-up {
  from { transform: translateY(16px); opacity: 0; }
}
.snackbar > span:first-of-type { flex: 1; font-size: 12.5px; min-width: 0; }
.snackbar button {
  color: #a9d6b2;
  font-size: 11.5px;
  font-weight: 750;
  letter-spacing: 0.6px;
  padding: 8px 10px;
  border-radius: 10px;
  flex-shrink: 0;
}
.snackbar-close { color: var(--snackbar-fg) !important; opacity: 0.8; }

/* ---------- Misc ---------- */

::selection { background: color-mix(in srgb, var(--primary) 25%, transparent); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

            setStore((s) => ({ ...s, tasks: [task, ...s.tasks] }));
            notify("Task added");
        },
        toggleTask: (id) => setStore((s) => ({
            ...s,
            tasks: s.tasks.map((t) => t.id === id ? { ...t, done: !t.done, doneOn: !t.done ? dateKey() : undefined } : t),
        })),
        deleteTask: (id) => {
            let removed;
            setStore((s) => {
                removed = s.tasks.find((t) => t.id === id);
                return { ...s, tasks: s.tasks.filter((t) => t.id !== id) };
            });
            notify("Task deleted", () => {
                if (removed)
                    setStore((s) => ({ ...s, tasks: [removed, ...s.tasks] }));
            });
        },
        addHabit: (title, subtitle, icon, color, kind) => {
            const habit = {
                id: uid(),
                title: title.trim(),
                subtitle: subtitle.trim(),
                icon,
                color,
                kind,
                history: [],
            };
            setStore((s) => ({ ...s, habits: [habit, ...s.habits] }));
            notify("Habit created");
        },
        toggleHabitToday: (id) => {
            const today = dateKey();
            setStore((s) => ({
                ...s,
                habits: s.habits.map((h) => h.id === id
                    ? {
                        ...h,
                        history: h.history.includes(today)
                            ? h.history.filter((d) => d !== today)
                            : [...h.history, today],
                    }
                    : h),
            }));
        },
        deleteHabit: (id) => {
            let removed;
            setStore((s) => {
                removed = s.habits.find((h) => h.id === id);
                return { ...s, habits: s.habits.filter((h) => h.id !== id) };
            });
            notify("Habit deleted", () => {
                if (removed)
                    setStore((s) => ({ ...s, habits: [...s.habits, removed] }));
            });
        },
        addEntry: (text, mood) => {
            const entry = { id: uid(), text: text.trim(), mood, date: dateKey(), ts: Date.now() };
            setStore((s) => ({
                ...s,
                entries: [entry, ...s.entries],
                moods: { ...s.moods, [entry.date]: mood },
            }));
            notify("Reflection saved");
        },
        deleteEntry: (id) => {
            let removed;
            setStore((s) => {
                removed = s.entries.find((e) => e.id === id);
                return { ...s, entries: s.entries.filter((e) => e.id !== id) };
            });
            notify("Reflection deleted", () => {
                if (removed)
                    setStore((s) => ({ ...s, entries: [removed, ...s.entries] }));
            });
        },
        setMoodToday: (mood) => setStore((s) => ({ ...s, moods: { ...s.moods, [dateKey()]: mood } })),
        setDark: (dark) => setStore((s) => ({ ...s, dark })),
        resetData: () => {
            setStore(seedStore());
            notify("Data reset to sample content");
        },
    }), [store, tab, sheet, toast, notify, dismissToast]);
    return <Ctx.Provider value={value}>{children}</Ctx.Provider>;
}

function Sheet({ open, onClose, title, children, }) {
    const sheetRef = useRef(null);
    const closeRef = useRef(onClose);
    const previousRef = useRef(null);
    closeRef.current = onClose;
    // Remember the element that opened the sheet, so focus can go back to it.
    useEffect(() => {
        if (open)
            return;
        const remember = (e) => {
            const target = e.target;
            if (target && target !== document.body)
                previousRef.current = target;
        };
        document.addEventListener("focusin", remember);
        return () => document.removeEventListener("focusin", remember);
    }, [open]);
    useEffect(() => {
        if (!open)
            return;
        const focusables = () => {
            const found = sheetRef.current?.querySelectorAll(FOCUSABLE);
            return found ? Array.from(found).filter((el) => !el.hasAttribute("disabled")) : [];
        };
        // A child with autoFocus has already claimed focus during commit.
        if (!sheetRef.current?.contains(document.activeElement)) {
            const list = focusables();
            (list[0] ?? sheetRef.current)?.focus();
        }
        const onKey = (e) => {
            if (e.key === "Escape") {
                closeRef.current();
                return;
            }
            if (e.key !== "Tab")
                return;
            const list = focusables();
            if (!list.length)
                return;
            const first = list[0];
            const last = list[list.length - 1];
            const active = document.activeElement;
            // Focus escaped the dialog (or never entered it) — pull it back in.
            if (!active || !sheetRef.current?.contains(active)) {
                e.preventDefault();
                (e.shiftKey ? last : first).focus();
                return;
            }
            if (e.shiftKey && active === first) {
                e.preventDefault();
                last.focus();
            }
            else if (!e.shiftKey && active === last) {
                e.preventDefault();
                first.focus();
            }
        };
        window.addEventListener("keydown", onKey);
        return () => {
            window.removeEventListener("keydown", onKey);
            previousRef.current?.focus?.();
        };
    }, [open]);

        return null;

      <div ref={sheetRef} className="sheet" role="dialog" aria-modal="true" aria-label={title} tabIndex={-1} onClick={(e) => e.stopPropagation()}>

function to12h(t) {
    const [h, m] = t.split(":").map(Number);
    if (Number.isNaN(h))
        return "";
    const suffix = h >= 12 ? "PM" : "AM";
    const hour = h % 12 === 0 ? 12 : h % 12;
    return `${hour}:${String(m ?? 0).padStart(2, "0")} ${suffix}`;
}

      </ul>
      <div className="setting-row">
        <span className="icon-tile tone-lilac">
          <Icon name={store.dark ? "moon" : "sun"} size={19}/>
        </span>
        <div>
          <strong>Dark theme</strong>
          <span>Follows Material You tones</span>
        </div>
        <Switch checked={store.dark} onChange={setDark} label="Toggle dark theme"/>
      </div>
      {confirmReset ? (<div className="confirm-row">
          <span>This replaces everything with the sample content. Your tasks, habits and reflections can't be recovered.</span>
          <div>
            <button className="text-btn" onClick={() => setConfirmReset(false)} onPointerDown={ripple}>
              Cancel
            </button>
            <button className="text-btn danger" onClick={() => {
                resetData();
                setConfirmReset(false);
                closeSheet();
            }} onPointerDown={ripple}>
              <Icon name="undo" size={16}/> Reset everything
            </button>
          </div>
        </div>) : (<button className="text-btn danger center" onClick={() => setConfirmReset(true)} onPointerDown={ripple}>
          <Icon name="undo" size={16}/> Reset sample data
        </button>)}
    </Sheet>);
}
function Snackbar() {
    const { toast, dismissToast } = useBloom();
    if (!toast)
        return null;
    return (<div className="snackbar" role="status">
      <span>{toast.message}</span>
      {toast.undo && (<button onClick={() => {
                toast.undo?.();
                dismissToast();
            }}>
          UNDO
        </button>)}
      <button className="snackbar-close" aria-label="Dismiss" onClick={dismissToast}>
        <Icon name="close" size={15}/>
      </button>
    </div>);
}
function DeviceFrame() {
    const { store, tab } = useBloom();
    return (<div className="device-stage">
      <div className={`device ${store.dark ? "dark" : ""}`}>
        <StatusBar />
        <div className="app-body">
          <TopBar />
          <main className="scroller" key={tab}>
            <HomeScreenRouted />
          </main>
          <Fabs />
          <NavBar />
        </div>
        <NewTaskSheet />
        <NewHabitSheet />
        <NotifsSheet />
        <ProfileSheet />
        <Snackbar />
        <div className="system-nav" aria-hidden="true">
          <span className="sys-pill"/>
        </div>
      </div>
      <div className="device-caption">
        <span>Pixel 8 Pro</span>
        <span>ANDROID · MATERIAL 3 · INTERACTIVE PROTOTYPE</span>
      </div>
    </div>);
}
function HomeScreenRouted() {
    const { tab } = useBloom();
    switch (tab) {
        case "tasks":
            return <TasksScreen />;
        case "habits":
            return <HabitsScreen />;
        case "journal":
            return <JournalScreen />;
        case "insights":
            return <InsightsScreen />;
        default:
            return <HomeScreen />;
    }
}
function App() {
    return (<BloomProvider>
      <DeviceFrame />
    </BloomProvider>);
}

      ReactDOM.createRoot(document.getElementById("root")).render(
        <React.StrictMode>
          <App />
        </React.StrictMode>,
      )
    </script>
  </body>
</html>
